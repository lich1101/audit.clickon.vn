<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clickon Rank Checker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Clickon Audit</p>
        <h1>Rank Checker</h1>
        <p class="subtitle">Cấu hình được lưu trên extension và đồng bộ hai chiều với hệ thống khi mở trang keyword rank.</p>
      </header>

      <form id="settings-form" class="panel">
        <label class="field">
          <span>Delay min (giây)</span>
          <input id="delay-min" type="number" min="1" max="120" step="1">
        </label>
        <label class="field">
          <span>Delay max (giây)</span>
          <input id="delay-max" type="number" min="1" max="180" step="1">
        </label>
        <label class="field">
          <span>Google host</span>
          <select id="google-host">
            <option value="https://www.google.com">google.com</option>
            <option value="https://www.google.com.vn">google.com.vn</option>
          </select>
        </label>
        <div class="grid-2">
          <label class="field">
            <span>hl</span>
            <input id="hl" type="text" maxlength="8">
          </label>
          <label class="field">
            <span>gl</span>
            <input id="gl" type="text" maxlength="8">
          </label>
        </div>
        <label class="checkbox-row">
          <input id="auto-captcha" type="checkbox">
          <span>Tự động giải captcha bằng 2captcha (trừ lượt trên hệ thống)</span>
        </label>
        <p class="hint">Không bật: gặp captcha sẽ mở tab để bạn giải thủ công.</p>
        <button type="submit" class="primary">Lưu cấu hình</button>
        <p id="save-status" class="save-status" hidden>Đã lưu.</p>
      </form>

      <button id="open-runner" type="button" class="secondary">Mở công cụ standalone</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
